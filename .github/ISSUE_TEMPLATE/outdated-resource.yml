name: Something here is outdated
description: Found a wrong phone number, old hours, bad link, or other stale resource info? Tell us.
title: "[Resource update] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for catching it. Resource information goes stale in deeply boring and surprisingly creative ways.

        **Quick privacy thing:** please don't include information about a person who was trying to get help. GitHub is public.

  - type: input
    id: resource
    attributes:
      label: Which resource or organization?
      placeholder: Example: Southeast Public Transit
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Where did you see it on SFMA?
      description: A link is great if you have it.
      placeholder: https://www.siouxfallsmutualaid.org/...

  - type: dropdown
    id: field
    attributes:
      label: What looks wrong?
      multiple: true
      options:
        - Phone/contact
        - Address/location
        - Hours/availability
        - Eligibility
        - Documentation required
        - Cost/fare
        - Service area
        - Program status
        - Website link
        - Something else
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What does SFMA currently say?
      description: Just the public listing info, please. No details about somebody who tried to use the service.

  - type: textarea
    id: correction
    attributes:
      label: What should it say instead?
      description: Tell us what changed and, if you know, how you found out.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Where can we verify it?
      description: The organization's own current site or another primary source is ideal.
      placeholder: https://...
    validations:
      required: true

  - type: dropdown
    id: verification
    attributes:
      label: How sure are we?
      options:
        - I found it on a current primary source
        - Current public sources disagree
        - The organization told me directly
        - I am not sure; somebody should verify this
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I did not include private information about someone seeking help.
          required: true
