# Internal intake form. Editorial/public calendar copy remains in copy.json.
name: Community event suggestion
description: Suggest a public community event for review (not an immediate help request).
title: "[Event] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Include public event details only; do not post personal assistance requests, private addresses or private group screenshots.
        Suggestions go through verification and editorial review before any public listing.
  - type: input
    id: event-name
    attributes:
      label: Event name
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Public event source URL
      placeholder: https://...
      description: A public organizer page or official event listing is preferred.
    validations:
      required: true
  - type: input
    id: organizer
    attributes:
      label: Organizer name
    validations:
      required: true
  - type: input
    id: community
    attributes:
      label: Community
      placeholder: Sioux Falls
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date (YYYY-MM-DD)
    validations:
      required: true
  - type: input
    id: start-time
    attributes:
      label: Start time (HH:MM, 24-hour local time; leave blank if unknown)
      placeholder: '13:30'
  - type: input
    id: end-time
    attributes:
      label: End time (HH:MM, 24-hour local time; leave blank if unknown)
      placeholder: '15:00'
  - type: input
    id: venue
    attributes:
      label: Public venue or location
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Event type
      options: [Resources, Civic, Arts, Community, Volunteer]
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: Cost
      options: [Unknown, Free]
    validations:
      required: true
  - type: dropdown
    id: highlight
    attributes:
      label: Possible mutual aid highlight
      options: ['No', 'Yes']
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Public attendance or eligibility restriction (optional)
  - type: textarea
    id: reviewer-notes
    attributes:
      label: Verification notes (internal research)
      description: Do not include information about private individuals.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: I have not included a private assistance request or sensitive personal information.
          required: true
